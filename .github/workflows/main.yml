name: CI

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - run: npm ci
    - run: npx lix run vshaxe-build -t language-server -t language-server-tests
    # Compiler-backed LSP integration runs in CI - Vanilla, which installs
    # Haxe on PATH. The Lix-only build here remains a pure unit-test job.
