name: Formatting

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
      with:
        submodules: true
    - run: |
        npm ci
        npx lix install haxelib:formatter
        npx lix run formatter -s . --check

    - name: Show formatter diff on failure
      if: failure()
      run: |
        npx lix run formatter -s .
        git diff -- src
